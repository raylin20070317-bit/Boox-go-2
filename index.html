var GomokuGame=(function(){
'use strict';
var N=15,KEY='gomoku-boox-v1',DIRS=[[0,1],[1,0],[1,1],[1,-1]];
var S={opp:'aiW',level:2,confirm:true,color:true};
var D=null;
var LV={1:{depth:1,ms:0,K:20},2:{depth:2,ms:900,K:16},3:{depth:3,ms:2200,K:14},4:{depth:4,ms:5000,K:12}};
var TAB=[0,1,12,120,1200,1000000];
var H={};
var cv=document.getElementById('cv');
var size=600,board=new Int8Array(N*N),G={moves:[],end:null};
var gameId=0,thinking=false,pending=-1,hint=null,resignArm=0,resignTimer=null,msgTimer=null,winCells=null;
var deadline=0,timeUp=false,nodes=0,K=10;
function $(id){return document.getElementById(id);}
function inb(r,c){return r>=0&&c>=0&&r<N&&c<N;}
function rcOf(i){return [(i/N)|0,i%N];}
function sideNow(){return G.moves.length%2===0?1:2;}
function aiColor(){return S.opp==='aiW'?2:(S.opp==='aiB'?1:-1);}
function humanTurn(){return !G.end&&!thinking&&!(aiColor()>=0&&sideNow()===aiColor());}
function coord(i){var p=rcOf(i);return String.fromCharCode(65+p[1])+(N-p[0]);}
function msg(t){
  $('msg').textContent=t||'';
  if(msgTimer)clearTimeout(msgTimer);
  if(t)msgTimer=setTimeout(function(){$('msg').textContent='';},4500);
}
/* ---------- engine ---------- */
function winAt(b,i,p){
  var r0=(i/N)|0,c0=i%N,d,s,r,c,cells;
  for(d=0;d<4;d++){
    cells=[i];
    for(s=1;;s++){r=r0+DIRS[d][0]*s;c=c0+DIRS[d][1]*s;if(!inb(r,c)||b[r*N+c]!==p)break;cells.push(r*N+c);}
    for(s=1;;s++){r=r0-DIRS[d][0]*s;c=c0-DIRS[d][1]*s;if(!inb(r,c)||b[r*N+c]!==p)break;cells.push(r*N+c);}
    if(cells.length>=5)return cells;
  }
  return null;
}
function own(b,p){
  var s=0,r,c,d,k,a,o,v,q=3-p;
  for(r=0;r<N;r++)for(c=0;c<N;c++)for(d=0;d<4;d++){
    if(!inb(r+4*DIRS[d][0],c+4*DIRS[d][1]))continue;
    a=0;o=0;
    for(k=0;k<5;k++){v=b[(r+k*DIRS[d][0])*N+c+k*DIRS[d][1]];if(v===p)a++;else if(v===q)o++;}
    if(o===0&&a>0)s+=TAB[a];
  }
  return s;
}
function evalFor(b,p){return own(b,p)-own(b,3-p)*1.05;}
function quick(b,j,p){
  var r0=(j/N)|0,c0=j%N,s=0,d,k,a,o,r,c,v;
  for(d=0;d<4;d++){
    a=0;o=0;
    for(k=-4;k<=4;k++){
      if(k===0)continue;
      r=r0+k*DIRS[d][0];c=c0+k*DIRS[d][1];
      if(!inb(r,c))continue;
      v=b[r*N+c];if(v===p)a++;else if(v===3-p)o++;
    }
    if(o===0)s+=TAB[Math.min(a,4)];
    else if(a===0)s+=TAB[Math.min(o,4)]*0.9;
  }
  return s;
}
function cands(b){
  var seen=new Uint8Array(N*N),list=[],i,r,c,dr,dc,rr,cc,j,any=false;
  for(i=0;i<N*N;i++){
    if(!b[i])continue;
    any=true;r=(i/N)|0;c=i%N;
    for(dr=-2;dr<=2;dr++)for(dc=-2;dc<=2;dc++){
      rr=r+dr;cc=c+dc;if(!inb(rr,cc))continue;
      j=rr*N+cc;if(!b[j]&&!seen[j]){seen[j]=1;list.push(j);}
    }
  }
  if(!any)return [7*N+7];
  return list;
}
function ordered(b,p,k){
  var list=cands(b),sc=[],i;
  for(i=0;i<list.length;i++)sc.push([quick(b,list[i],p)+quick(b,list[i],3-p)*0.9,list[i]]);
  sc.sort(function(x,y){return y[0]-x[0];});
  return sc.slice(0,k).map(function(x){return x[1];});
}
function negamax(b,depth,alpha,beta,p){
  nodes++;
  if((nodes&255)===0&&Date.now()>deadline)timeUp=true;
  if(timeUp)return 0;
  if(depth===0)return evalFor(b,p);
  var list=ordered(b,p,K),best=-Infinity,i,j,sc;
  if(!list.length)return 0;
  for(i=0;i<list.length;i++){
    j=list[i];b[j]=p;
    if(winAt(b,j,p)){b[j]=0;return 1000000+depth;}
    sc=-negamax(b,depth-1,-beta,-alpha,3-p);
    b[j]=0;
    if(timeUp)return 0;
    if(sc>best)best=sc;
    if(best>alpha)alpha=best;
    if(alpha>=beta)break;
  }
  return best;
}
function search(b,p,level){
  var L=LV[level],q=3-p,all=cands(b),i,j,w,root,bestMove=-1,bestVal=-Infinity,d,ord,rMove,rVal,a,sc,k;
  K=L.K;deadline=Date.now()+L.ms;timeUp=false;nodes=0;
  for(i=0;i<all.length;i++){j=all[i];b[j]=p;w=winAt(b,j,p);b[j]=0;if(w)return {move:j,score:1e6};}
  for(i=0;i<all.length;i++){j=all[i];b[j]=q;w=winAt(b,j,q);b[j]=0;if(w)return {move:j,score:-1e6};}
  root=ordered(b,p,L.K);
  if(!root.length)return {move:all[0],score:0};
  if(level===1){
    var scored=root.map(function(x){b[x]=p;var v=evalFor(b,p);b[x]=0;return [v,x];}).sort(function(x,y){return y[0]-x[0];});
    var top=scored.slice(0,Math.min(3,scored.length));
    return {move:top[(Math.random()*top.length)|0][1],score:top[0][0]};
  }
  bestMove=root[0];
  for(d=1;d<=L.depth;d++){
    ord=ordered(b,p,K);
    if(bestMove>=0){k=ord.indexOf(bestMove);if(k>0){ord.splice(k,1);ord.unshift(bestMove);}else if(k<0)ord.unshift(bestMove);}
    rMove=-1;rVal=-Infinity;a=-Infinity;
    for(i=0;i<ord.length;i++){
      j=ord[i];b[j]=p;
      if(winAt(b,j,p)){b[j]=0;rMove=j;rVal=1000000;break;}
      sc=-negamax(b,d-1,-Infinity,-a,q);
      b[j]=0;
      if(timeUp)break;
      if(sc>rVal){rVal=sc;rMove=j;}
      if(sc>a)a=sc;
    }
    if(timeUp)break;
    if(rMove>=0){bestMove=rMove;bestVal=rVal;}
    if(bestVal>=1000000)break;
  }
  return {move:bestMove,score:bestVal};
}
/* ---------- game flow ---------- */
function replay(){
  board.fill(0);G.end=null;winCells=null;
  for(var i=0;i<G.moves.length;i++)board[G.moves[i]]=(i%2===0)?1:2;
  if(G.moves.length){
    var last=G.moves[G.moves.length-1],p=board[last],w=winAt(board,last,p);
    if(w){winCells=w;G.end={result:p===1?'b':'w',reason:'five in a row'};}
    else if(G.moves.length===N*N)G.end={result:'d',reason:'board is full'};
  }
}
function newGame(){
  G={moves:[],end:null};board.fill(0);winCells=null;
  pending=-1;hint=null;thinking=false;resignArm=0;gameId++;
  save();
}
function place(j){
  var p=sideNow();
  G.moves.push(j);board[j]=p;
  var w=winAt(board,j,p);
  if(w){winCells=w;G.end={result:p===1?'b':'w',reason:'five in a row'};}
  else if(G.moves.length===N*N)G.end={result:'d',reason:'board is full'};
  pending=-1;hint=null;
  save();msg('');ui();maybeAI();
}
function maybeAI(){
  if(G.end||aiColor()<0||sideNow()!==aiColor())return;
  thinking=true;msg('Computer is thinking…');ui();
  var gid=gameId,level=S.level;
  setTimeout(function(){
    if(gid!==gameId)return;
    var r=search(board,sideNow(),level);
    thinking=false;
    if(r.move>=0&&!board[r.move])place(r.move);else ui();
  },60);
}
function resultText(){
  var e=G.end;
  if(e.result==='d')return 'Draw ('+e.reason+')';
  return (e.result==='b'?'Black':'White')+' wins ('+e.reason+')';
}
function onTap(j){
  if(G.end)return;
  if(!humanTurn()){if(thinking)msg('Computer is thinking…');return;}
  if(board[j]){msg('That point is occupied');return;}
  if(!S.confirm){place(j);return;}
  if(pending===j){place(j);return;}
  pending=j;msg('Tap again or press Confirm Move');ui();
}

/* ---------- drawing ---------- */
function geom(){var m=size*0.075;return {m:m,cell:(size-2*m)/(N-1)};}
function xyOf(i,g){var p=rcOf(i);return {x:g.m+p[1]*g.cell,y:g.m+p[0]*g.cell};}
function draw(){
  var c=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  c.setTransform(dpr,0,0,dpr,0,0);
  var g=geom(),i,k,p,R,a,fs;
  c.fillStyle=S.color?'#f0d9b5':'#ffffff';c.fillRect(0,0,size,size);
  c.strokeStyle='#000';c.lineWidth=2;
  for(k=0;k<N;k++){
    c.beginPath();c.moveTo(g.m,g.m+k*g.cell);c.lineTo(g.m+(N-1)*g.cell,g.m+k*g.cell);c.stroke();
    c.beginPath();c.moveTo(g.m+k*g.cell,g.m);c.lineTo(g.m+k*g.cell,g.m+(N-1)*g.cell);c.stroke();
  }
  var stars=[3,7,11];c.fillStyle='#000';
  stars.forEach(function(ra){stars.forEach(function(cb){c.beginPath();c.arc(g.m+cb*g.cell,g.m+ra*g.cell,size*0.007,0,7);c.fill();});});
  c.fillStyle='#000';fs=Math.round(Math.max(10,Math.min(g.m*0.5,22)));
  c.font='bold '+fs+'px sans-serif';c.textAlign='center';c.textBaseline='middle';
  for(k=0;k<N;k++){
    var lab=String.fromCharCode(65+k);
    c.fillText(lab,g.m+k*g.cell,g.m*0.5);
    c.fillText(lab,g.m+k*g.cell,size-g.m*0.5);
    c.fillText(String(N-k),g.m*0.5,g.m+k*g.cell);
    c.fillText(String(N-k),size-g.m*0.5,g.m+k*g.cell);
  }
  R=g.cell*0.46;
  for(i=0;i<N*N;i++){
    if(!board[i])continue;
    p=xyOf(i,g);
    c.beginPath();c.arc(p.x,p.y,R,0,7);
    c.fillStyle=board[i]===1?'#000':'#fff';c.fill();
    c.lineWidth=2;c.strokeStyle='#000';c.stroke();
  }
  if(winCells){
    c.lineWidth=4;
    winCells.forEach(function(w){p=xyOf(w,g);c.beginPath();c.arc(p.x,p.y,R+size*0.012,0,7);c.stroke();});
  }
  if(hint!==null&&hint>=0){
    p=xyOf(hint,g);c.setLineDash([6,4]);c.lineWidth=4;c.strokeStyle='#000';
    c.strokeRect(p.x-R*1.1,p.y-R*1.1,R*2.2,R*2.2);c.setLineDash([]);
  }
  if(pending>=0){
    p=xyOf(pending,g);c.beginPath();c.arc(p.x,p.y,R*0.9,0,7);
    c.setLineDash([5,4]);c.lineWidth=3;c.strokeStyle='#000';c.stroke();c.setLineDash([]);
  }
  if(G.moves.length){
    var lm=G.moves[G.moves.length-1];a=board[lm]===1;p=xyOf(lm,g);
    c.fillStyle=a?'#fff':'#000';c.fillRect(p.x-R*0.25,p.y-R*0.25,R*0.5,R*0.5);
  }
}

H.cv=function(e){
  var rc=cv.getBoundingClientRect(),k=rc.width/size,g=geom();
  var x=(e.clientX-rc.left)/k,y=(e.clientY-rc.top)/k;
  var c=Math.round((x-g.m)/g.cell),r=Math.round((y-g.m)/g.cell);
  if(!inb(r,c))return;
  if(Math.abs(x-(g.m+c*g.cell))>g.cell*0.5||Math.abs(y-(g.m+r*g.cell))>g.cell*0.5)return;
  onTap(r*N+c);
};

H.bUndo=function(){
  if(thinking||!G.moves.length)return;

  function closeMenu(silent){
    $('menu').hidden=true;$('menuBack').hidden=true;
    if(cur&&!silent)cur.menuClosed();
    else if(cur)cur.menuClosed();
  }
  $('pickGo').onclick=function(){openSetup('go',false);};
  $('pickChess').onclick=function(){openSetup('chess',false);};
  $('pickDraughts').onclick=function(){openSetup('draughts',false);};
  $('pickHanafuda').onclick=function(){openSetup('hanafuda',false);};
  $('pickGomoku').onclick=function(){openSetup('gomoku',false);};
  $('resGo').onclick=function(){resume('go');};
  $('resChess').onclick=function(){resume('chess');};
  $('resDraughts').onclick=function(){resume('draughts');};
  $('resHanafuda').onclick=function(){resume('hanafuda');};
  $('resGomoku').onclick=function(){resume('gomoku');};
  $('bStart').onclick=startNew;
  $('bBack').onclick=backFromSetup;
  $('bMenu').onclick=function(){if($('menu').hidden)openMenu();else closeMenu();};
  $('menuBack').onclick=function(){closeMenu();};
  $('menu').addEventListener('click',function(e){
    var b=e.target;
    while(b&&b!==this&&b.tagName!=='BUTTON')b=b.parentNode;
    if(!b||b===this)return;
    if(cur&&cur.menuKeep(b.id))return;
    $('menu').hidden=true;$('menuBack').hidden=true;
  });
  $('bHelpClose').onclick=function(){$('dlgHelp').hidden=true;};
  window.addEventListener('resize',function(){
    clearTimeout(rt);
    rt=setTimeout(function(){if(screen==='game'&&cur){cur.layout();cur.ui();}},200);
  });
  window.addEventListener('popstate',function(e){
    var s=(e.state&&e.state.s)||'home';
    if(s==='game'){if(cur)show('game',true);else goHome(false);}
    else if(s==='set'){if(setGame){closeMenu(true);show('set');}else goHome(false);}
    else goHome(false);
  });
  try{history.replaceState({s:'home'},'');}catch(e){}
  drawIcons();refreshHome();show('home');
  return {
    openSetup:openSetup,
    showHelp:function(html){$('helpList').innerHTML=html;$('dlgHelp').hidden=false;},
    goHome:goHome
  };
})();

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}});
}

</script>
</body>
</html>
